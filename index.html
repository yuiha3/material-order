<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>発注リスト作成</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@600;700;800&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600;9..40,700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="app">
    <section class="panel left-panel">
      <div class="hero">
        <div>
          <h1>材料発注</h1>
          <p>材料を選ぶだけで、発注文面を自動で整形します。</p>
        </div>
      </div>

      <div class="toolbar">
        <div class="search-area">
          <div class="search-box">
            <input id="searchInput" type="text" placeholder="材料名・メーカー名で検索" />
            <span class="search-icon">⌕</span>
          </div>
          <button id="clearSearchBtn" class="ghost-btn search-clear-btn" type="button">検索クリア</button>
        </div>
        <button id="openItemModalBtn" class="item-manage-btn" type="button">＋ 材料を追加・削除</button>
      </div>

      <div class="supplier-information">
        資材・塗装は三興塗料の山田さんにLINEで連絡。<br>
        シール・防水・その他材料は野口興産に電話。<br>
        042-354-6622
      </div>

      <div class="tabs-row">
        <div id="tabsContainer" class="tabs"></div>
        <button id="openTabModalBtn" class="tab-manage-btn" type="button" aria-label="タブ管理">⚙</button>
      </div>

      <div id="makersContainer" class="makers"></div>
    </section>

    <aside class="panel right-panel">
      <h2>発注テキスト</h2>
      <p>選択内容に応じて、メーカーごとにまとめた文章を自動生成します。</p>

      <div class="preview">
        <div class="field staff-field">
          <label for="staffSelect">担当者名</label>
          <select id="staffSelect"></select>
        </div>

        <div class="field location-field">
          <label for="locationSelect">受け取り場所</label>
          <select id="locationSelect">
            <option value="新座倉庫入れ" selected>新座倉庫入れ</option>
            <option value="現場入れ">現場入れ</option>
          </select>
        </div>

        <div class="field site-field">
          <div class="site-field-label-row">
            <label for="siteNameInput">現場名 <span class="required-badge site-required-badge" style="display:none;">必須</span></label>
            <button id="openSiteModalBtn" class="site-manage-btn" type="button">登録・削除</button>
          </div>
          <div class="combobox" id="siteCombobox">
            <input id="siteNameInput" type="text" value="なし" placeholder="現場名を入力または選択" autocomplete="off" />
            <button class="combobox-arrow" id="siteComboboxBtn" type="button" aria-label="選択肢を表示">▾</button>
            <div class="combobox-dropdown" id="siteDropdown" style="display:none;"></div>
          </div>
        </div>

        <div class="field address-field" id="addressField" style="display:none;">
          <label for="addressInput">現場住所 <span class="required-badge">必須</span></label>
          <input id="addressInput" type="text" placeholder="住所を入力してください" />
        </div>

        <div class="preview-head">
          <div class="preview-title">PREVIEW</div>
        </div>

        <textarea id="resultText"></textarea>

        <div class="actions">
          <button id="copyBtn" class="primary-btn" type="button">コピー</button>
          <button id="resetBtn" class="ghost-btn" type="button">リセット</button>
        </div>
      </div>
    </aside>
  </div>

  <!-- Site Registration Modal -->
  <div id="siteModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">現場名・住所の登録</h3>
        <button id="closeModalBtn" class="modal-close-btn" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">

        <!-- Registered list -->
        <div class="modal-section">
          <p class="modal-section-label">登録済み現場</p>
          <div id="siteList" class="site-list">
            <div class="site-list-empty">まだ登録された現場はありません</div>
          </div>
        </div>

        <!-- Add new site form -->
        <div class="modal-section modal-add-form">
          <p class="modal-section-label">新規登録</p>
          <div class="field">
            <label for="newSiteNameInput">現場名</label>
            <input id="newSiteNameInput" type="text" placeholder="例：渋谷ビル" />
          </div>
          <div class="field" style="margin-top:10px;">
            <label for="newSiteAddressInput">現場住所</label>
            <input id="newSiteAddressInput" type="text" placeholder="例：東京都渋谷区〇〇1-2-3" />
          </div>
          <button id="addSiteBtn" class="primary-btn" type="button" style="margin-top:14px;width:100%;">登録する</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Item Management Modal -->
  <div id="itemModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card modal-card-wide">
      <div class="modal-header">
        <h3 class="modal-title">材料の追加・削除</h3>
        <button id="closeItemModalBtn" class="modal-close-btn" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">

        <!-- Filter & list -->
        <div class="modal-section">
          <div class="item-modal-list-header">
            <p class="modal-section-label" style="margin:0;">登録済み材料</p>
            <select id="itemListCategoryFilter" class="item-category-filter"></select>
          </div>
          <div id="itemList" class="item-list"></div>
        </div>

        <!-- Add form -->
        <div class="modal-section modal-add-form">
          <p class="modal-section-label">新規追加</p>

          <div class="item-form-grid">
            <div class="field">
              <label for="newItemCategory">カテゴリ <span class="required-badge">必須</span></label>
              <select id="newItemCategory"></select>
            </div>
            <div class="field">
              <label for="newItemMaker">メーカー名 <span class="required-badge">必須</span></label>
              <input id="newItemMaker" type="text" placeholder="例：大塚刷毛" />
            </div>
            <div class="field item-form-full">
              <label for="newItemName">商品名 <span class="required-badge">必須</span></label>
              <input id="newItemName" type="text" placeholder="例：スカーレットEX(25mm) 6インチ" />
            </div>
            <div class="field">
              <label for="newItemUnits">単位オプション <span class="required-badge">必須</span></label>
              <input id="newItemUnits" type="text" placeholder="例：箱,袋（カンマ区切り）" />
            </div>
            <div class="field">
              <label for="newItemCapacities">容量オプション</label>
              <input id="newItemCapacities" type="text" placeholder="例：16kg,4kg（任意）" />
            </div>
            <div class="field">
              <label for="newItemColorMode">色設定</label>
              <select id="newItemColorMode">
                <option value="none">なし</option>
                <option value="code">色番号入力</option>
                <option value="name">色名選択</option>
              </select>
            </div>
            <div class="field item-color-code-field" style="display:none;">
              <label for="newItemDefaultColorCode">デフォルト色番号</label>
              <input id="newItemDefaultColorCode" type="text" placeholder="例：N-90" />
            </div>
            <div class="field item-color-name-field item-form-full" style="display:none;">
              <label for="newItemColorNames">色名リスト</label>
              <input id="newItemColorNames" type="text" placeholder="例：白,グレー,赤さび（カンマ区切り）" />
            </div>
            <div class="field item-form-full">
              <label for="newItemGlosses">艶オプション</label>
              <input id="newItemGlosses" type="text" placeholder="例：艶あり,半艶,艶なし（任意）" />
            </div>
          </div>

          <button id="addItemBtn" class="primary-btn" type="button" style="margin-top:16px;width:100%;">追加する</button>
        </div>

      </div>
    </div>
  </div>

  <!-- Tab Management Modal -->
  <div id="tabModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div class="modal-header">
        <h3 class="modal-title">タブの管理</h3>
        <button id="closeTabModalBtn" class="modal-close-btn" type="button" aria-label="閉じる">✕</button>
      </div>
      <div class="modal-body">
        <div class="modal-section">
          <p class="modal-section-label">現在のタブ</p>
          <div id="tabList" class="site-list"></div>
        </div>
        <div class="modal-section modal-add-form">
          <p class="modal-section-label">タブを追加</p>
          <div class="field">
            <label for="newTabNameInput">タブ名（カテゴリ名）</label>
            <input id="newTabNameInput" type="text" placeholder="例：シール、防水" />
          </div>
          <button id="addTabBtn" class="primary-btn" type="button" style="margin-top:14px;width:100%;">追加する</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Confirm Modal -->
  <div id="confirmModal" class="modal-overlay" style="display:none;" role="dialog" aria-modal="true">
    <div class="modal-card confirm-card">
      <div class="confirm-body">
        <p id="confirmMessage" class="confirm-message"></p>
        <div class="confirm-actions">
          <button id="confirmCancelBtn" class="ghost-btn" type="button">キャンセル</button>
          <button id="confirmOkBtn" class="danger-btn" type="button">削除する</button>
        </div>
      </div>
    </div>
  </div>

  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <button id="scrollToBottomBtn" class="floating-scroll-btn" type="button" aria-label="一番下までスクロール">
    ↓
  </button>

  <script src="script.js"></script>
</body>
</html>
